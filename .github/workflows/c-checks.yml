name: C23 Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - dev

jobs:
  setup-and-checks:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CFLAGS: -std=c2x -Wall -Wextra -Wpedantic

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make cppcheck clang-tidy clang-format bear

      - name: Build (prefer Makefile + bear, fallback to per-file compile)
        run: |
          set -e
          mkdir -p build
          if [ -f Makefile ] || [ -f makefile ]; then
            # Use bear to capture compile commands for clang-tidy
            if command -v bear >/dev/null 2>&1; then
              bear -- make -j$(nproc) || (echo "make failed"; exit 1)
              # bear produces compile_commands.json in repo root
              if [ -f compile_commands.json ]; then
                mv compile_commands.json build/ || true
              fi
            else
              make -j$(nproc) || (echo "make failed"; exit 1)
            fi
          else
            # Fallback: compile all tracked .c files into object files (no link)
            git ls-files '*.c' | xargs -r -I{} sh -c '$CC $CFLAGS -I. -c "{}" -o build/$(basename "{}").o'
          fi

      - name: Run cppcheck (static analysis)
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c2x \
            --language=c \
            --suppress=missingIncludeSystem \
            --xml \
            --inline-suppr \
            --error-exitcode=1 \
            --exclude=.git \
            --exclude=.github \
            --exclude=cmake-build-debug \
            --force \
            . 2> cppcheck-report.xml || true
        
          if grep -q '<error ' cppcheck-report.xml; then
            echo "cppcheck errors detected"
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: c-check-logs
          path: |
            build/
            cppcheck-report.xml
